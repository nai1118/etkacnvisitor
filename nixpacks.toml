# Build settings for Groovedeploy (nixpacks). Vercel ignores this file.
# On the build network only npm's own downloads get through (corepack's direct
# downloads time out), so pnpm is fetched via npx instead of corepack.
# NODE_ENV=development so devDependencies (tailwind, typescript) are installed.
[phases.install]
cmds = ["NODE_ENV=development npx --yes pnpm@11.22.0 install --frozen-lockfile"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
